name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rm -f package-lock.json && npm install --legacy-peer-deps
      - name: show-error
        if: failure()
        run: |
          LOG=$(ls -t /home/runner/.npm/_logs/*.log 2>/dev/null | head -1)
          tail -n 80 "$LOG" | grep -E "npm error|ERR!|error code" | head -30 | while IFS= read -r line; do echo "::error::${line:0:250}"; done
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
